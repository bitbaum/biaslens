# pnpm 11 blocks dependency postinstall scripts by default; these two need
# their builds: esbuild installs its platform binary, unrs-resolver its
# native resolver (used by eslint-config-next).
allowBuilds:
  ai-forms@https://codeload.github.com/bitbaum/ai-forms/tar.gz/f5689bbdf60c1e4ab0651d828c6478ee94ecdd64: set this to true or false
  esbuild: true
  unrs-resolver: true
# Reviewed exact first-party releases, exercised by BiasLens browser and user-flow tests.
minimumReleaseAgeExclude:
  - '@bitbaum/ai-kit@1.21.3 || 1.21.4'
  - '@bitbaum/sitekit@0.4.2'
  - '@bitbaum/chatkit@0.15.2 || 0.15.3 || 0.16.0 || 0.17.1 || 0.18.0 || 0.19.0 || 0.20.1 || 0.21.0 || 0.21.1'
  - '@bitbaum/design-tokens@1.2.0'
  - bip-kit@0.6.1
  - '@bitbaum/accountkit'

# Legacy Drizzle Kit TS-config loader uses esbuild transform, never its dev server.
# Keep that loader on the patched API; drizzle-kit check validates config loading.
overrides:
  '@esbuild-kit/core-utils>esbuild': '^0.25.0'
