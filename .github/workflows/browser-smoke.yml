name: Browser design smoke

# A real Chromium run against an optimised local production build.
# Screenshots are artifacts; green does not imply manual visual approval.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: browser-design-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Browser QA at phone and desktop widths
        run: pnpm run browser:smoke
      - name: Retain screenshots and server logs for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biaslens-browser-design
          path: browser-smoke-artifacts/
          retention-days: 14
          if-no-files-found: warn
