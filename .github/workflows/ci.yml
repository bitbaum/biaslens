# Golden CI floor — see dotfiles/templates/ci/README.md.
# biaslens: npm + vitest + Prisma. Floor = verify (lint + typecheck + test);
# the 14-case suite now runs on every push & PR. Prisma has no postinstall, so
# the client is generated explicitly before typecheck needs its types. Build is
# deferred (Next + Prisma build needs DB/env) — add it once a postgres service
# is wired (revampit e2e-local pattern in the template README).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma generate (types for typecheck)
        run: npx prisma generate

      # SSOT: lint + typecheck + test, defined once in package.json `verify`.
      - name: Verify
        run: npm run verify
